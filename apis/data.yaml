openapi: 3.1.0
info:
  title: YESS Ci
  version: 1.0.0
  description: Example workspace
servers:
  - url: http://10.184.0.2:8080/v1
    description: ""
paths:
  /auth/login:
    post:
      operationId: login
      tags:
        - auth
      summary: Login
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      expires_in:
                        type: integer
                      token_type:
                        type: string
                        examples:
                          - Bearer
                    required:
                      - access_token
                      - expires_in
                      - token_type
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                      internal_code:
                        type: string
                      message:
                        type: string
                      trace_id:
                        type: string
                    required:
                      - status_code
                      - internal_code
                      - message
                      - trace_id
                required:
                  - data
                  - meta
        "400":
          $ref: "#/components/responses/BadRequest"
      requestBody:
        required: true
        description: ""
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  examples:
                    - budi@nusantara.com
                    - kautsar@email.com
                password:
                  type: string
                  examples:
                    - StrongPassword123!
                    - password123
              required:
                - email
                - password
      parameters: []
      description: Login untuk mendapatkan akses token
  /company/register:
    post:
      operationId: registerCompany
      tags:
        - company
      summary: Register Company
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status_code:
                    type: number
                    examples:
                      - 201
                  message:
                    type: string
                    examples:
                      - company created
                required:
                  - success
                  - status_code
                  - message
        "400":
          $ref: "#/components/responses/BadRequest"
      parameters: []
      description: Register Company
      requestBody:
        required: true
        description: ""
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                logo_url:
                  type: string
                tax_id:
                  type: string
                address:
                  type: string
                phone_number:
                  type: string
              required:
                - name
                - logo_url
                - tax_id
                - address
                - phone_number
  /user/profile:
    get:
      operationId: profile
      tags:
        - user
      summary: Profile
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      property_name:
                        type: string
                      company_name:
                        type: string
                      full_name:
                        type: string
                      email:
                        type: string
                      phone_number:
                        type: string
                      joined_at:
                        type: string
                      is_active:
                        type: boolean
                    required:
                      - id
                      - property_name
                      - company_name
                      - full_name
                      - email
                      - phone_number
                      - joined_at
                      - is_active
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                      internal_code:
                        type: string
                      message:
                        type: string
                      trace_id:
                        type: string
                    required:
                      - status_code
                      - internal_code
                      - message
                      - trace_id
                required:
                  - data
                  - meta
        "400":
          $ref: "#/components/responses/BadRequest"
      parameters: []
      description: Profile
  /property:
    get:
      operationId: listProperty
      tags:
        - property
      summary: List Property
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            address:
                              type: string
                            owner_name:
                              type: string
                            type:
                              type: string
                            unit_count:
                              type: integer
                            unit_available:
                              type: integer
                            start_price:
                              type: number
                            image_url:
                              type: string
                          required:
                            - id
                            - name
                            - address
                            - owner_name
                            - type
                            - unit_count
                            - unit_available
                            - start_price
                            - image_url
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                          per_page:
                            type: integer
                          total_page:
                            type: integer
                          total_item:
                            type: integer
                        required:
                          - current_page
                          - per_page
                          - total_page
                          - total_item
                    required:
                      - data
                      - pagination
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                      message:
                        type: string
                      trace_id:
                        type: string
                      internal_code:
                        type: string
                    required:
                      - status_code
                      - message
                      - trace_id
                      - internal_code
                required:
                  - data
                  - meta
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - in: query
          name: page
          required: false
          style: form
          description: ""
          explode: true
          schema:
            type: integer
            minimum: 1
          allowReserved: false
        - in: query
          name: limit
          required: false
          style: form
          description: ""
          explode: true
          schema:
            type: integer
          allowReserved: false
        - in: query
          name: search
          required: false
          style: form
          description: ""
          explode: true
          schema:
            type: string
          allowReserved: false
        - in: query
          name: type
          required: false
          style: form
          description: ""
          explode: true
          schema:
            type: string
          allowReserved: false
      description: List Property
      security:
        - BearerJwt: []
    post:
      operationId: createProperty
      tags:
        - property
      summary: Create Property
      responses:
        "201":
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status_code:
                    type: integer
                  message:
                    type: string
                required:
                  - success
                  - status_code
                  - message
        "400":
          $ref: "#/components/responses/BadRequest"
      parameters: []
      description: Create Property
      requestBody:
        required: true
        description: ""
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: string
                property_type_id:
                  type: integer
                name:
                  type: string
                address:
                  type: string
                owner_name:
                  type: string
                subdistrict_id:
                  type: integer
                map_link:
                  type: string
                description:
                  type: string
                facility_id:
                  type: array
                  items:
                    type: integer
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      value:
                        type: string
                    required:
                      - type
                      - value
                photos:
                  type: array
                  items:
                    type: string
                units:
                  type: array
                  items:
                    type: object
                    properties:
                      unit_number:
                        type: string
                      floor_level:
                        type: string
                      name:
                        type: string
                      base_price:
                        type: number
                      default_tx_percent:
                        type: number
                      discount_type:
                        type: string
                      discount_value:
                        type: number
                    required:
                      - unit_number
                      - floor_level
                      - name
                      - base_price
                      - default_tx_percent
                      - discount_type
                      - discount_value
              required:
                - company_id
                - property_type_id
                - name
                - address
                - owner_name
                - subdistrict_id
                - map_link
                - description
                - facility_id
                - contacts
                - photos
                - units
      security:
        - BearerJwt: []
  /property/{propertyId}:
    put:
      operationId: editProperty
      tags:
        - property
      summary: Edit Property
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                      internal_code:
                        type: string
                      message:
                        type: string
                      trace_id:
                        type: string
                    required:
                      - status_code
                      - internal_code
                      - message
                      - trace_id
                required:
                  - meta
        "400":
          $ref: "#/components/responses/BadRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      parameters:
        - $ref: "#/components/parameters/propertyId"
      security:
        - BearerJwt: []
    delete:
      operationId: deleteProperty
      tags:
        - property
      summary: Delete Property
      parameters:
        - $ref: "#/components/parameters/propertyId"
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          $ref: "#/components/responses/BadRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
    get:
      operationId: detailProperty
      tags:
        - property
      summary: Detail Property
      parameters:
        - $ref: "#/components/parameters/propertyId"
      responses:
        "200":
          description: The request was successful, and the server has returned the
            requested resource in the response body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      type:
                        type: string
                      image_url:
                        type: string
                      address:
                        type: string
                      standard_price:
                        type: number
                        description: harga terendah dari semua unit di properti tsb
                      total_unit:
                        type: integer
                      units:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            unit_number:
                              type: string
                            type:
                              type: string
                            status:
                              type: string
                            base_price:
                              type: number
                          required:
                            - id
                            - unit_number
                            - type
                            - status
                            - base_price
                    required:
                      - id
                      - name
                      - type
                      - image_url
                      - address
                      - standard_price
                      - total_unit
                      - units
                  meta:
                    type: object
                    properties:
                      status_code:
                        type: integer
                      internal_code:
                        type: string
                      message:
                        type: string
                      trace_id:
                        type: string
                    required:
                      - status_code
                      - internal_code
                      - message
                      - trace_id
                required:
                  - data
                  - meta
        "400":
          $ref: "#/components/responses/BadRequests"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      security:
        - BearerJwt: []
components:
  responses:
    Ok:
      description: The request was successful, and the server has returned the
        requested resource in the response body.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  data:
                    type: object
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_page:
                        type: integer
                      total_item:
                        type: integer
                    required:
                      - current_page
                      - per_page
                      - total_page
                      - total_item
                required:
                  - data
                  - pagination
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  internal_code:
                    type: string
                  message:
                    type: string
                  trace_id:
                    type: string
                required:
                  - status_code
                  - internal_code
                  - message
                  - trace_id
            required:
              - data
              - meta
    BadRequest:
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  internal_code:
                    type: string
                  message:
                    type: string
                  trace_id:
                    type: string
                required:
                  - status_code
                  - internal_code
                  - message
                  - trace_id
            required:
              - meta
    NoContent:
      description: The request was successful, but there is no content to return in
        the response.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: "null"
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_page:
                        type: integer
                      total_item:
                        type: integer
                    required:
                      - current_page
                      - per_page
                      - total_page
                      - total_item
                required:
                  - data
                  - pagination
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  message:
                    type: string
                  trace_id:
                    type: string
                  internal_code:
                    type: string
                required:
                  - status_code
                  - message
                  - trace_id
                  - internal_code
            required:
              - data
              - meta
    Unauthorized:
      description: Authentication is required to access the requested resource. The
        client must include the appropriate credentials.
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  internal_code:
                    type: string
                  message:
                    type: string
                  trace_id:
                    type: string
                required:
                  - status_code
                  - internal_code
                  - message
                  - trace_id
            required:
              - meta
    Forbidden:
      description: The server understood the request, but refuses to authorize it.
        Ensure the client has appropriate permissions.
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  internal_code:
                    type: string
                  message:
                    type: string
                  trace_id:
                    type: string
                required:
                  - status_code
                  - internal_code
                  - message
                  - trace_id
            required:
              - meta
    InternalServerError:
      description: The server encountered an unexpected condition that prevented it
        from fulfilling the request. Report the issue to the support team if it
        persists.
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  internal_code:
                    type: string
                  message:
                    type: string
                  trace_id:
                    type: string
                required:
                  - status_code
                  - internal_code
                  - message
                  - trace_id
            required:
              - meta
    BadRequests:
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  internal_code:
                    type: string
                  message:
                    type: string
                  trace_id:
                    type: string
                required:
                  - status_code
                  - internal_code
                  - message
                  - trace_id
            required:
              - meta
    NotFound:
      description: The server cannot find the requested resource. The endpoint may be
        invalid or the resource may no longer exist.
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                type: object
                properties:
                  status_code:
                    type: integer
                  internal_code:
                    type: string
                  message:
                    type: string
                  trace_id:
                    type: string
                required:
                  - status_code
                  - internal_code
                  - message
                  - trace_id
            required:
              - meta
  securitySchemes:
    BearerJwt:
      type: http
      bearerFormat: BearerJwt
      scheme: Bearer
      description: "Jwt Auth: Authenticated requests contain a valid Json Web Token
        (JWT) as part of the `Authorization: Bearer <JWT>` header."
  parameters:
    propertyId:
      name: propertyId
      in: path
      required: true
      schema:
        type: string
tags:
  - name: auth
  - description: ""
    name: property
  - name: company
  - name: user
